[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lexguard-agent"
version = "0.1.0"
description = "Fail-closed paper-options decision service for Lexguard."
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.16.4",
  "alpaca-py==0.42.2",
  "fastapi==0.116.1",
  "fastmcp==3.1.0",
  "httpx==0.28.1",
  "numpy==2.3.2",
  "openai==1.99.9",
  "pandas==2.3.1",
  "psycopg[binary]==3.2.13",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "sqlalchemy==2.0.43",
  "tzdata==2025.2",
  "typer==0.16.0",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.138.4",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
  "types-requests==2.32.4.20250809",
]

[project.scripts]
lexguard = "lexguard.cli:app"
lexguard-research = "lexguard.research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lexguard"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "alpaca_smoke: opt-in read-only smoke test against an Alpaca paper MCP server",
  "openai_smoke: opt-in structured-output smoke test with no Alpaca access",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["lexguard"]
