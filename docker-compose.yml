name: lexguard

x-agent-env: &agent-env
  ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
  ALPACA_API_KEY: ${ALPACA_API_KEY:?Set ALPACA_API_KEY in .env}
  ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:?Set ALPACA_SECRET_KEY in .env}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
  DATABASE_URL: postgresql+psycopg://lexguard:lexguard@postgres:5432/lexguard
  LEXGUARD_ENVIRONMENT: ${LEXGUARD_ENVIRONMENT:-development}
  LEXGUARD_ENTRY_ENABLED: ${LEXGUARD_ENTRY_ENABLED:-false}
  LEXGUARD_MCP_URL: http://mcp:8010/mcp
  LEXGUARD_OPTION_FEED: ${LEXGUARD_OPTION_FEED:-indicative}
  LEXGUARD_MAX_QUOTE_WIDTH: ${LEXGUARD_MAX_QUOTE_WIDTH:-0.40}
  LEXGUARD_COMPETITION_BASELINE: ${LEXGUARD_COMPETITION_BASELINE:-100000}
  LEXGUARD_UNDERLYING: ${LEXGUARD_UNDERLYING:-SPY}
  LEXGUARD_UNDERLYING_ROTATION: ${LEXGUARD_UNDERLYING_ROTATION:-SPY,QQQ,IWM,SPY}
  LEXGUARD_ALLOWED_SIDES: ${LEXGUARD_ALLOWED_SIDES:-BOTH}
  LEXGUARD_MAX_ENTRIES_PER_DAY: ${LEXGUARD_MAX_ENTRIES_PER_DAY:-3}
  LEXGUARD_OPERATOR_TOKEN: ${LEXGUARD_OPERATOR_TOKEN:-change_me_operator_token}
  LEXGUARD_ALLOWED_ORIGIN: http://localhost:3000
  LEXGUARD_FORECAST_ARTIFACT_PATH: /app/agent/artifacts/generated/forecast-SPY.json
  LEXGUARD_FORECAST_ARTIFACT_PATH_QQQ: /app/agent/artifacts/generated/forecast-QQQ.json
  LEXGUARD_FORECAST_ARTIFACT_PATH_IWM: /app/agent/artifacts/generated/forecast-IWM.json

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lexguard
      POSTGRES_PASSWORD: lexguard
      POSTGRES_DB: lexguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexguard -d lexguard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mcp:
    build:
      context: .
      dockerfile: infra/Dockerfile.mcp
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY:?Set ALPACA_API_KEY in .env}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:?Set ALPACA_SECRET_KEY in .env}
      ALPACA_PAPER_TRADE: "true"
    ports:
      - "${MCP_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8010), 3).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.agent
    environment:
      <<: *agent-env
    volumes:
      - agent_artifacts:/app/agent/artifacts
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.agent
    environment:
      <<: *agent-env
    volumes:
      - agent_artifacts:/app/agent/artifacts
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: infra/Dockerfile.agent
    environment:
      <<: *agent-env
    volumes:
      - agent_artifacts:/app/agent/artifacts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        lexguard seed-risk-state || true;
        lexguard seed-forecast --symbol SPY --output /app/agent/artifacts/generated/forecast-SPY.json || true;
        lexguard seed-forecast --symbol QQQ --output /app/agent/artifacts/generated/forecast-QQQ.json || true;
        lexguard seed-forecast --symbol IWM --output /app/agent/artifacts/generated/forecast-IWM.json || true;
        exec lexguard scheduler --watch
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      network: host
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  agent_artifacts:
