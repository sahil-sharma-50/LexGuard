# Attach to a third Railway service: the official Alpaca MCP server.
# Internal-only; the agent reaches it via the private network URL in
# LEXGUARD_MCP_URL (e.g. http://alpaca-mcp.railway.internal:8010/mcp).
[build]
dockerfilePath = "infra/Dockerfile.mcp"

[deploy]
startCommand = "alpaca-mcp-server --transport streamable-http --host 0.0.0.0 --port 8010"
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
